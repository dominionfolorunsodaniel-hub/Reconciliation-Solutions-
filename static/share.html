<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Shared statement check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg:#f4f7fd; --card:#fff; --ink:#0b1b3f; --mute:#55627f; --line:#dbe3f2; --brand:#0b5ce6; --ok:#0b5ce6; --warn:#b54708; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c1426; --card:#121c35; --ink:#e6ecf8; --mute:#9fb0d3; --line:#26335a; --brand:#6ea8ff; --ok:#6ea8ff; --warn:#f0b36b; --bad:#f2877b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 14px; }
  header b { font-size:18px; } header small { color:var(--mute); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; min-width:0; }
  h2 { margin:0 0 6px; font-size:19px; } h3 { margin:14px 0 6px; font-size:16px; }
  .hero { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .gauge { --p:0; --c:#0b5ce6; width:128px; height:128px; border-radius:50%; display:grid; place-items:center; position:relative; flex:0 0 auto; background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0); }
  .gauge::before { content:""; position:absolute; inset:12px; border-radius:50%; background:var(--card); }
  .gauge div { position:relative; text-align:center; line-height:1.05; } .gauge b { font-size:36px; display:block; } .gauge small { color:var(--mute); font-size:12px; }
  .verdict { display:inline-block; padding:4px 14px; border-radius:99px; font-weight:800; font-size:14px; color:#fff; }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:12px; }
  .kpi { border:1px solid var(--line); border-radius:12px; padding:10px; } .kpi small { color:var(--mute); display:block; } .kpi b { font-size:18px; overflow-wrap:anywhere; }
  .scroll { overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; } th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; } .neg { color:var(--bad); font-weight:700; }
  .banner { border-radius:12px; padding:10px 14px; margin:10px 0; border-left:5px solid var(--ok); background:rgba(11,92,230,.08); }
  .banner.warning { border-color:var(--warn); background:rgba(181,71,8,.08); } .banner.failed { border-color:var(--bad); background:rgba(180,35,24,.08); } .banner.unavailable { border-color:var(--mute); background:rgba(120,130,150,.1); }
  ul { margin:4px 0; padding-left:20px; } .mute { color:var(--mute); } .small { font-size:12.5px; }
  .bar { display:grid; grid-template-columns:minmax(110px,1.2fr) 2fr auto; gap:10px; align-items:center; margin:5px 0; font-size:13.5px; }
  .track { height:9px; border-radius:99px; background:var(--line); overflow:hidden; } .track i { display:block; height:100%; background:var(--brand); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  a.btn { display:inline-block; background:var(--brand); color:#fff; text-decoration:none; padding:9px 16px; border-radius:8px; font-weight:600; }
  @media (max-width:700px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .two { grid-template-columns:1fr; } .bar { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<div class="wrap">
  <header><div><b>RECONZA</b><br><small>Shared statement check</small></div><small id="exp"></small></header>
  <div id="msg" class="card">Loading...</div>
  <div id="out" hidden></div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = text; if (cls) e.className = cls; return e; }
  function ngn(v) { return (v == null || isNaN(v)) ? "–" : (v < 0 ? "-" : "") + "₦" + Math.abs(Math.round(v)).toLocaleString(); }
  var token = location.pathname.split("/").filter(Boolean).pop();
  fetch("/api/shared/" + encodeURIComponent(token), { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error(r.status === 404 ? "This link has expired or was switched off by its owner." : "Could not load this page. Please try again in a few minutes.");
    return r.json();
  }).then(render).catch(function (e) { $("msg").textContent = e.message; });

  function box(h) { var c = el("div", "", "card"); if (h) c.append(el("h2", h)); $("out").append(c); return c; }
  function render(d) {
    $("msg").hidden = true; $("out").hidden = false;
    $("exp").textContent = "Link works until " + d.expires_at.replace("T", " ").slice(0, 16) + " UTC";
    var col = d.score >= 75 ? "#0b5ce6" : d.score >= 60 ? "#3f8f73" : d.score >= 45 ? "#b54708" : "#b42318";
    var c = box(), hero = el("div", "", "hero"), g = el("div", "", "gauge"), gi = el("div");
    g.style.setProperty("--p", d.score); g.style.setProperty("--c", col); gi.append(el("b", d.score), el("small", "out of 100")); g.append(gi);
    var side = el("div"); var v = el("span", d.verdict, "verdict"); v.style.background = col;
    side.append(v, el("p", d.eligibility), el("small", (d.company ? d.company + " · " : "") + "Period " + d.period + " · " + d.totals.months + " month(s)" + (d.accounts > 1 ? " · " + d.accounts + " accounts combined" : ""), "mute"));
    hero.append(g, side); c.append(hero);
    var k = d.totals, kp = el("div", "", "kpis");
    [["Total income", ngn(k.income)], ["Total spending", ngn(k.expenses)], ["Left over", ngn(k.net)], ["Avg left over / month", ngn(k.avg_left_over)]].forEach(function (x) { var q = el("div", "", "kpi"); q.append(el("small", x[0]), el("b", x[1])); kp.append(q); });
    c.append(kp);

    if (d.integrity && d.integrity.status) {
      var b = el("div", "", "banner " + (d.integrity.status === "passed" ? "" : d.integrity.status));
      var t = { passed: "Statement looks genuine", warning: "Some balances do not add up", failed: "Balances do not add up: may have been edited", unavailable: "Authenticity check not possible" }[d.integrity.status] || "";
      b.append(el("b", t), el("div", d.integrity.message || "", "small")); c.append(b);
    }
    if (d.flags && d.flags.length) { var f = box("Unusual patterns"), ul = el("ul"); d.flags.forEach(function (x) { ul.append(el("li", "[" + x.severity + "] " + x.title + ": " + x.detail)); }); f.append(ul); }

    var m = box("Month by month"), wrap = el("div", "", "scroll"), tbl = el("table"), hr = el("tr");
    d.columns.forEach(function (n) { hr.append(el("th", n)); }); tbl.append(hr);
    d.rows.forEach(function (row) { var tr = el("tr"); d.columns.forEach(function (n) { var x = row[n], money = /income|expenses|left over|balance/i.test(n); var td = el("td", money ? ngn(x) : (x == null ? "–" : String(x))); if (money && x < 0) td.className = "neg"; tr.append(td); }); tbl.append(tr); });
    wrap.append(tbl); m.append(wrap);

    if ((d.spending && d.spending.length) || (d.income && d.income.length)) {
      var cb = box("Where the money goes and comes from"), two = el("div", "", "two");
      [["Spending", d.spending], ["Money in", d.income]].forEach(function (pair) {
        var s = el("div"); s.append(el("h3", pair[0]));
        (pair[1] || []).slice(0, 8).forEach(function (r) { var row = el("div", "", "bar"), tr = el("div", "", "track"), i = el("i"); i.style.width = r.share_pct + "%"; tr.append(i); row.append(el("span", r.category), tr, el("b", ngn(r.amount) + " (" + r.share_pct + "%)")); s.append(row); });
        two.append(s);
      });
      cb.append(two);
    }
    var w = box("Summary"), t3 = el("div", "", "two"), a = el("div"), bb = el("div");
    a.append(el("h3", "Good signs")); var u1 = el("ul"); (d.strengths.length ? d.strengths : ["Nothing stands out yet."]).forEach(function (x) { u1.append(el("li", x)); }); a.append(u1);
    bb.append(el("h3", "Concerns")); var u2 = el("ul"); (d.concerns.length ? d.concerns : ["No big worries found."]).forEach(function (x) { u2.append(el("li", x)); }); bb.append(u2);
    t3.append(a, bb); w.append(t3);
    if (d.loan_guide) { var lg = d.loan_guide; w.append(el("h3", "Rough loan guide"), el("p", "Comfortable monthly repayment up to " + ngn(lg.max_monthly_repayment) + ". Roughly " + ngn(lg.rough_loan_6_months) + " over 6 months or " + ngn(lg.rough_loan_12_months) + " over 12 months, before interest."), el("small", lg.how, "mute")); }
    var fc = box("How the score is built");
    d.factors.forEach(function (x) { var row = el("div", "", "bar"), tr = el("div", "", "track"), i = el("i"); i.style.width = (x.max ? x.score / x.max * 100 : 0) + "%"; tr.append(i); var lab = el("div"); lab.append(el("b", x.name), el("div", x.detail, "mute small")); row.append(lab, tr, el("b", x.score + " / " + x.max)); fc.append(row); });
    var end = box(); end.append(el("p", d.disclaimer, "mute small"));
    var p = el("a", "Download PDF", "btn"); p.href = "/api/shared/" + encodeURIComponent(token) + "/pdf"; end.append(p);
    end.append(el("p", "This page shows a frozen copy of one result that its owner chose to share. It contains no files and no login.", "mute small"));
  }
})();
</script>
</body>
</html>
