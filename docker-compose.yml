services:
  web:
    build: .
    command: python web.py
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3

  bot:
    build: .
    command: python bot.py
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
